[main]
# Uygulama listesini açar
mode=drun

# İkonları etkinleştirin
icons-enabled=true
icon-theme=Papirus # İkon teması adınız
notification-icon-size=24

# --- Görünüm ve Boyut ---
font=Noto Sans:size=11
# Boyutu sabit piksel yerine yüzde olarak ayarlamak daha simetrik olur.
width=25%
height=50%
horizontal-padding=10
vertical-padding=10
line-height=30
max-lines=15

# Pencereyi ekranın ortasına sabitler
layer=overlay
terminal=wezterm

[colors]
# Tema: Koyu Arkaplan ve Mavi Vurgu

# Arkaplan: Koyu Gri, Yarı Saydam (Alpha: E6 = ~90%)
background=1e1e2eE6
# Metin rengi
text=CDD6F4FF
# Sınır (Çerçeve) rengi
border=84A8C0FF

# Seçili öğe renkleri
[selection]
# Seçili arka plan (Yarı Saydam Mavi)
background=84A8C077
# Seçili metin rengi
text=FDF6E3FF
border=84A8C0FF

# --- Stil ---
[border]
radius=15  # Yuvarlak köşeler
width=3    # Kalın sınır
