# ~/.config/hypr/hypridle.conf

general {
    # loginctl lock-session sinyali geldiğinde hyprlock'u çalıştırır.
    # Bu, SUPER+L bastığınızda hyprlock'u ekrana getirecek komuttur.
    lock_cmd = pidof hyprlock |

| hyprlock 
    
    # Oturumu kapatıp açarken veya uyku moduna geçerken kararlılık için (Şiddetle tavsiye edilir)
    before_sleep_cmd = loginctl lock-session 
    inhibit_sleep = 3 
}

# hypridle'ın aktif olarak çalışması için en az bir dinleyici (listener) olmalıdır. 
# Bu örnek, 5 dakika hareketsizlikten sonra otomatik kilitler (isteğe bağlı, ama iyidir). [1, 2]
listener {
    timeout = 300 
    on-timeout = loginctl lock-session 
}
